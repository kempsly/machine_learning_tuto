<!DOCTYPE html>
<html>
<head>
    <title>LangChain Flask App</title>
</head>
<body>
    <h1>LangChain Demo With LLAMA2</h1>

    <form method="POST">
        <input type="text" name="question" placeholder="What question do you have in mind?" style="width:300px;">
        <button type="submit">Ask</button>
    </form>

    {% if answer %}
        <h3>Answer:</h3>
        <p>{{ answer }}</p>
    {% endif %}
</body>
</html>
